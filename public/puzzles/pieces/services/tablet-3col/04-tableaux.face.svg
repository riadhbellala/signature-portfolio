<svg xmlns="http://www.w3.org/2000/svg" viewBox="-380 -380 1760 1760">
  <!-- body square: 0 0 1000 1000 (top face); thickness 48 below; edges t/r/b/l: tab / socket / tab / flat -->
  <!-- layer: face. Render every base layer of a group first, then every face layer. -->
  <defs>
    <path id="sg-tablet-3col-04-tableaux-face-p" d="M0 0 L350 0 C420 0 430 -35 400 -80 C370 -130 330 -300 500 -300 C670 -300 630 -130 600 -80 C570 -35 580 0 650 0 L1000 0 L1000 350 C1000 420 965 430 920 400 C870 370 700 330 700 500 C700 670 870 630 920 600 C965 570 1000 580 1000 650 L1000 1000 L650 1000 C580 1000 570 1035 600 1080 C630 1130 670 1300 500 1300 C330 1300 370 1130 400 1080 C430 1035 420 1000 350 1000 L0 1000 L0 0 Z"/>
    <g id="sg-tablet-3col-04-tableaux-face-side"><use href="#sg-tablet-3col-04-tableaux-face-p" y="2"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="4"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="6"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="8"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="10"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="12"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="14"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="16"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="18"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="20"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="22"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="24"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="26"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="28"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="30"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="32"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="34"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="36"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="38"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="40"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="42"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="44"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="46"/><use href="#sg-tablet-3col-04-tableaux-face-p" y="48"/></g>
    <filter id="sg-tablet-3col-04-tableaux-face-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="sg-tablet-3col-04-tableaux-face-bevel" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.7" specularExponent="64" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="225" elevation="48"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feDiffuseLighting in="blur" surfaceScale="5" diffuseConstant="1" lighting-color="#ffffff" result="diff">
        <feDistantLight azimuth="225" elevation="58"/>
      </feDiffuseLighting>
      <!-- flat diffuse = sin(58deg) = 0.848, so k1 = 1/0.848 keeps the flat face on the exact brand colour -->
      <feComposite in="SourceGraphic" in2="diff" operator="arithmetic" k1="1.179" k2="0" k3="0" k4="0" result="lit"/>
      <feComposite in="lit" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.5" k4="0" result="out"/>
      <feComposite in="out" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <use href="#sg-tablet-3col-04-tableaux-face-p" fill="currentColor" filter="url(#sg-tablet-3col-04-tableaux-face-bevel)"/>
</svg>
